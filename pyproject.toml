[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify_tools"
version = "2026.10.23"
requires-python = ">=3.11"
description = "Create Spotify playlists from Winamp exports or from AI suggestions based on seed songs"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Herman Böök" }]
dependencies = [
  "spotipy>=2.26",  # Older versions read playlists from a deprecated endpoint
  "google-genai>=1.67",
  "httpx>=0.28",
  "pydantic>=2.11",
  "beautifulsoup4>=4.13",
  "PySide6-Essentials>=6.8",  # Window for the playlist creator; the full PySide6 adds about 128 MB of unused modules
]

[tool.setuptools.packages.find]
include = ["modules*"]