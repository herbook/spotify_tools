[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify_tools"
version = "2026.10.19"
requires-python = ">=3.11"
description = "Create Spotify playlists from Winamp exports or from AI suggestions based on seed songs"
readme = "README.md"
license = "PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Herman Böök" }]
dependencies = [
  "spotipy>=2.26",  # Older versions read playlists from a deprecated endpoint
  "google-genai>=1.67",
  "pydantic>=2.11",
  "beautifulsoup4>=4.13",
]

[tool.setuptools.packages.find]
include = ["modules*"]